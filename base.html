<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>进制造物局：从 0 和 1 到 Z</title>
<style>
:root{
  --bg:#1e1e1e; --bg2:#313233; --panel:#c6c6c6; --edge:#181818; --hi:#8b8b8b;
  --on:#ff2200; --glow:#ff5533; --off:#4a0d00;
  --paper:#e6d5ac; --paper2:#d9c491; --ink:#1a365d; --gold:#b7791f;
  --good:#3fae2a; --bad:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:#e8e8e8;
  font-family:"VT323","Minecraftia","Courier New","PingFang SC","Microsoft YaHei",monospace;
  overflow-x:hidden; user-select:none;
}
::-webkit-scrollbar{display:none}
html{scrollbar-width:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;min-height:44px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{display:block}
.crisp{shape-rendering:crispEdges}
.small{font-size:13px;opacity:.85}

#hud{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px;background:#101010;border-bottom:4px solid #000;box-shadow:0 4px 0 #2c2c2c}
.brand{display:flex;align-items:center;gap:9px;font-size:20px;letter-spacing:1px;color:#fff;text-shadow:2px 2px 0 #000}
.brand .rd{width:14px;height:14px;background:var(--on);box-shadow:0 0 8px var(--glow);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.55}}
.hud-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.mc-btn{padding:8px 18px;background:#6f6f6f;color:#fff;text-shadow:2px 2px 0 #3a3a3a;
  border:3px solid var(--edge);box-shadow:inset 2px 2px 0 #a5a5a5,inset -2px -2px 0 #4a4a4a;
  transition:filter .15s ease-in-out}
.mc-btn:hover{filter:brightness(1.18)}
.mc-btn:active{transform:translateY(2px);box-shadow:inset -2px -2px 0 #a5a5a5,inset 2px 2px 0 #4a4a4a}
.mc-btn.g{background:#5b8c2a;box-shadow:inset 2px 2px 0 #8bc34a,inset -2px -2px 0 #3d631c}
.mc-btn.r{background:#a03028;box-shadow:inset 2px 2px 0 #d06050,inset -2px -2px 0 #6a1c16}
.mc-btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
a.mc-btn{display:inline-block;text-decoration:none}
.mc-panel{background:var(--panel);color:#222;border:4px solid var(--edge);
  box-shadow:inset 3px 3px 0 #e8e8e8,inset -3px -3px 0 #8b8b8b;padding:12px}
.paper{background:var(--paper);color:var(--ink);border:4px solid var(--edge);
  box-shadow:inset 0 0 0 3px var(--paper2);padding:14px}
.paper h3{color:var(--gold);font-size:18px;letter-spacing:1px;margin-bottom:8px;text-shadow:1px 1px 0 #fff3d6}
.paper h4{color:var(--ink);margin:10px 0 4px;font-size:15px}
.paper p,.paper li{font-size:14px;line-height:1.55}
.paper ul{padding-left:18px}
.formula{background:#f4ead0;border:2px dashed var(--gold);padding:6px 10px;margin:6px 0;font-size:15px;color:#7a2d0c;text-align:center}

.screen{display:none}
.screen.on{display:block;animation:scrIn .35s ease-in-out}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

#map-wrap{max-width:1060px;margin:16px auto;padding:0 12px}
#map-svg{width:100%;height:auto}
.trace{stroke:var(--off);stroke-width:7;fill:none;stroke-linecap:square;stroke-linejoin:round;transition:stroke .3s}
.trace.lit{stroke:var(--on);filter:drop-shadow(0 0 6px var(--glow));stroke-dasharray:12 12;animation:traceFlow 1.2s linear infinite}
@keyframes traceFlow{to{stroke-dashoffset:-24}}
.node{cursor:pointer;transition:transform .15s ease-in-out;transform-box:fill-box;transform-origin:center}
.node:hover{transform:scale(1.07)}
.node.lock{cursor:not-allowed;filter:grayscale(.85) brightness(.55)}
.node.clear .nring{stroke:var(--good)}
.nlabel{font-size:15px;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:4px;text-anchor:middle;pointer-events:none}
.nlabel.dim{fill:#888}
.map-title{font-size:26px;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:5px}
.map-sub{font-size:14px;fill:#ffb066;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:4px}

.stage-wrap{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:14px;max-width:1240px;margin:14px auto;padding:0 12px;align-items:start}
@media(max-width:1024px){
  .stage-wrap{grid-template-columns:1fr}
  .lab{min-height:0}
  #hud .brand{font-size:16px}
  .hint-fab{right:10px;bottom:10px}
}
.lab{position:relative;background:
  linear-gradient(rgba(255,255,255,.03) 2px,transparent 2px),
  linear-gradient(90deg,rgba(255,255,255,.03) 2px,transparent 2px),var(--bg2);
  background-size:32px 32px;border:4px solid #000;box-shadow:inset 0 0 0 3px #4a4a4b;
  padding:10px;min-height:460px}
.lab-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.lab-title{font-size:19px;color:#ffd976;text-shadow:2px 2px 0 #000}
.lab-goal{font-size:14px;color:#cfe3ff;background:#00000055;padding:4px 10px;border-left:4px solid var(--gold)}
.rail{display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{padding:6px 10px;background:#b8a67a;color:#4a3a18;border:2px solid #8a6d3b;min-height:36px;font-size:13px;transition:background .15s}
.tabs button.on{background:var(--gold);color:#fff;text-shadow:1px 1px 0 #6a4c0e}

.comp{position:absolute;perspective:700px;touch-action:manipulation}
.comp .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s ease-in-out}
body.sci .comp .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.face.back{transform:rotateY(180deg)}
.face svg{width:100%;height:100%}
.comp.clickable{cursor:pointer}
.comp.clickable:hover{filter:brightness(1.2)}
.comp.ghost{opacity:.28;filter:grayscale(.6)}

.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wires path,.wires polyline{fill:none;stroke:var(--off);stroke-width:6;stroke-linecap:square;stroke-linejoin:round;transition:stroke .18s,filter .18s}
.wires .w1{stroke:var(--on);filter:drop-shadow(0 0 5px var(--glow))}

.sig1{filter:drop-shadow(0 0 8px var(--glow))}

#toast-layer{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(92vw,520px)}
.toast{background:#241202;border:3px solid var(--gold);color:#ffd976;padding:12px 18px;text-align:center;
  box-shadow:0 0 24px rgba(255,180,0,.4);animation:tin .35s cubic-bezier(.2,1.6,.4,1)}
.toast b{color:#fff;font-size:17px}
@keyframes tin{from{transform:translateY(-30px) scale(.7);opacity:0}}

.overlay{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(8,8,14,.82)}
.overlay.on{display:flex}
.beam{position:absolute;left:50%;bottom:0;width:150px;height:100vh;transform:translateX(-50%);
  background:linear-gradient(to top,rgba(150,225,255,.95),rgba(150,225,255,0) 85%);
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);animation:beamup 1.1s ease-out both}
@keyframes beamup{from{transform:translateX(-50%) scaleY(0);transform-origin:bottom}to{transform:translateX(-50%) scaleY(1)}}
.cert{position:relative;z-index:2;width:min(92vw,560px);text-align:center;animation:tin .5s cubic-bezier(.2,1.6,.4,1)}
.cert h2{color:var(--gold);font-size:26px;margin:6px 0}
.cert .cname{font-size:22px;color:#7a2d0c;border-bottom:3px solid var(--gold);display:inline-block;padding:0 20px;margin:8px 0}
.modal-card{width:min(92vw,560px);max-height:82vh;overflow:auto;animation:tin .3s ease-out}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.stage-nav{display:flex;gap:8px;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.hint-fab{position:fixed;right:14px;bottom:14px;z-index:70}
input[type=range]{width:100%;height:44px;accent-color:var(--on)}

/* ---------- 数字元件 ---------- */
.digit-box{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.digit{min-width:44px;height:60px;background:#111;border:3px solid #555;display:flex;align-items:center;justify-content:center;
  font-size:34px;color:#3a3a3a;transition:all .2s;font-weight:bold}
.digit.on{color:var(--on);border-color:var(--on);text-shadow:0 0 10px var(--glow)}
.digit.hold{color:#ffd976;border-color:var(--gold);text-shadow:0 0 10px #ffd976}
.digit-label{font-size:12px;color:#8ec8ff;text-align:center;margin-top:4px}
.bits{display:flex;gap:8px;justify-content:center;font-size:26px;flex-wrap:wrap}
.bits b{background:#111;border:2px solid #555;padding:2px 10px;color:#7fd0ff}
.bits b.on{color:var(--on);border-color:var(--on);text-shadow:0 0 8px var(--glow)}
.big-dec{font-size:34px;color:#ffd976;text-shadow:2px 2px 0 #000;text-align:center;letter-spacing:2px}
.base-badge{display:inline-block;background:#1a365d;color:#ffe8a0;border:2px solid var(--gold);padding:2px 10px;font-size:15px;margin:2px}
.challenge-stars{font-size:26px;letter-spacing:8px;text-align:center;color:#ffd976;text-shadow:2px 2px 0 #000}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.base-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.base-tabs button{padding:6px 12px;background:#3a3a3a;color:#bbb;border:2px solid #000;min-height:40px;font-size:15px}
.base-tabs button.on{background:var(--on);color:#fff;text-shadow:1px 1px 0 #700}
.base-tabs button:disabled{opacity:.35}
.num-input{width:100%;font:inherit;font-size:28px;text-align:center;background:#111;color:#7fd0ff;
  border:3px solid #555;padding:8px;letter-spacing:4px}
.num-input:focus{outline:none;border-color:var(--gold)}
</style>
</head>
<body>
<div id="hud">
  <div class="brand"><span class="rd"></span>进制造物局<span class="small">从 0 和 1 到 Z</span></div>
  <div class="hud-right">
    <a class="mc-btn g" href="index.html">← 返回大厅</a>
    <button class="mc-btn" id="btn-lens">红石透镜：游戏</button>
    <button class="mc-btn" id="btn-bag">背包</button>
    <button class="mc-btn" id="btn-mute">音效：开</button>
  </div>
</div>

<main>
  <section id="screen-map" class="screen on">
    <div id="map-wrap"><svg id="map-svg" viewBox="0 0 1000 580" class="crisp"></svg></div>
  </section>

  <section id="screen-stage" class="screen">
    <div class="stage-wrap">
      <div class="lab" id="lab"></div>
      <aside class="rail">
        <div class="paper" id="rail-qa"></div>
        <div class="paper" id="rail-tt"></div>
      </aside>
    </div>
    <div class="stage-nav" style="max-width:1240px;margin:0 auto;padding:0 12px 22px">
      <button class="mc-btn" id="btn-back">← 返回地图</button>
      <button class="mc-btn r" id="btn-reset-lab">清空重试</button>
      <button class="mc-btn g" id="btn-next">下一关 →</button>
    </div>
    <button class="mc-btn hint-fab" id="btn-hint">史蒂夫求助</button>
  </section>

  <section id="screen-forge" class="screen">
    <div style="max-width:1240px;margin:14px auto;padding:0 12px">
      <div class="lab-head">
        <span class="lab-title">终极造物 · 进制转换机</span>
        <span class="lab-goal" id="forge-goal">把拉杆/输入框的信号，用寄存器固化成数字，在输出框里打印出任意进制！</span>
      </div>
      <div class="lab" id="forge-lab" style="min-height:0"></div>
      <div class="row mt12" style="justify-content:center">
        <button class="mc-btn" id="btn-back2">← 返回地图</button>
        <button class="mc-btn r" id="forge-clear">清空机器</button>
      </div>
    </div>
  </section>
</main>

<div id="toast-layer"></div>
<div class="overlay" id="ov-beam">
  <div class="beam"></div>
  <div class="cert paper" id="cert-body"></div>
</div>
<div class="overlay" id="ov-modal"><div class="modal-card paper" id="modal-body"></div></div>

<script>
/* ================= 工具 ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

/* ================= 进制核心库（2~36） ================= */
const DIGITS='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function toBase(n,base){
  if(n===0)return '0';
  let s='';n=Math.abs(Math.floor(n));
  while(n>0){s=DIGITS[n%base]+s;n=Math.floor(n/base);}
  return s;
}
function fromBase(str,base){
  str=String(str).toUpperCase().trim();
  let n=0;
  for(const ch of str){
    const d=DIGITS.indexOf(ch);
    if(d<0||d>=base)return null;
    n=n*base+d;
  }
  return n;
}
function expand(n,base){
  const s=toBase(n,base);
  return s.split('').map((ch,i)=>{
    const d=DIGITS.indexOf(ch);
    const p=s.length-1-i;
    return {ch,d,p,w:Math.pow(base,p)};
  });
}

/* ================= 像素图标工厂 ================= */
function px(map,pal,vb){
  vb=vb||16;let s='';
  for(let y=0;y<map.length;y++){const r=map[y];
    for(let x=0;x<r.length;x++){const c=pal[r[x]];
      if(c)s+='<rect x="'+x+'" y="'+y+'" width="1.04" height="1.04" fill="'+c+'"/>'}}
  return '<svg viewBox="0 0 '+vb+' '+vb+'" class="crisp" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>';
}
const P={
  k:'#181818',w:'#ffffff',g:'#8b8b8b',G:'#5a5a5a',r:'#ff2200',R:'#4a0d00',o:'#ff8800',
  b:'#8b5a2b',B:'#5e3a17',y:'#ffd976',e:'#3ddc84',s:'#c78d5e',S:'#8a5a3a',H:'#3a2a1a',
  u:'#3a3ac8',d:'#8a5a2b',D:'#6b4420',n:'#5b8c2a',l:'#ffe8a0',L:'#6a5a28',
  i:'#d8d8d8',I:'#9a9a9a',c:'#b87333',p:'#3a6ea5',t:'#3aa8a0',v:'#4a5aa8',x:'#2a2a2a',m:'#1a1a1a',
  z:'#7fd0ff',Z:'#1a365d'
};
const IC={};
IC.grass=px([
"nnnnnnnnnnnnnnnn","nnNnnnnnNnnnnNnn","nnnnnnnnnnnnnnnn","nNnnnnNnnnnNnnnn",
"nnnnnnnnnnnnnnnn","dddddddddddddddd","ddDddddddDdddddd","ddddddDddddddddd",
"dDdddddddddDdddd","ddddddDddddddddd","ddddddddddDddddd","ddDddddddddddddd",
"ddddddDdddddDddd","dddddddddddddddd","ddDdddDddddDddDd","dddddddddddddddd"],P);
IC.lever=px([
"................",".......yy.......",".......yy.......","......bb........",
"......bb........",".....bb.........",".....bb.........","....bb..........",
"....bb..........","..kkkkkkkkkk....","..kggggggggk....","..kgGgGggGgk....",
"..kggggggggk....","..kggGgggGgk....","..kkkkkkkkkk....","................"],P);
IC.lampOn=px([
".kkkkkkkkkkkkkk.","kllylllllylllylk","kllllllolllllllk","kylllloooolllllk",
"kllllooooooolllk","kllooooyyoooollk","kllooooyyoooollk","kllooooyyoooollk",
"kllllooooooolllk","kylllloooolllllk","kllllllolllllllk","kllylllllylllylk",
".kkkkkkkkkkkkkk.","................","................","................"],P);
IC.lampOff=px([
".kkkkkkkkkkkkkk.","kLLxLLLLLxLLLxLk","kLLLLLLxLLLLLLLk","kxLLLLxxxLLLLLLk",
"kLLLLxxxxxxLLLLk","kLLxxxxxxxxxLLLk","kLLxxxxxxxxxxLLk","kLLxxxxxxxxxLLLk",
"kLLLLxxxxxxLLLLk","kxLLLLxxxLLLLLLk","kLLLLLLxLLLLLLLk","kLLxLLLLLxLLLxLk",
".kkkkkkkkkkkkkk.","................","................","................"],P);
/* 寄存器（静置器）：把亮着的灯冻结成数字 */
IC.register=px([
"................","..kkkkkkkkkkkk..",".kppppppppppppk.",".kpzzzzzzzzzzpk.",
".kpzkkkkkkkkzpk.",".kpzkyyyyyykzpk.",".kpzkykkkkykzpk.",".kpzkykZZkykzpk.",
".kpzkykZZkykzpk.",".kpzkykkkkykzpk.",".kpzkyyyyyykzpk.",".kpzkkkkkkkkzpk.",
".kpzzzzzzzzzzpk.",".kppppppppppppk.","..kkkkkkkkkkkk..","................"],P);
/* 输入框 */
IC.input=px([
"................","..kkkkkkkkkkkk..",".kwwwwwwwwwwwwk.",".kwkkkkkkkkkwwk.",
".kwkzzzzzzzzkwk.",".kwkzkkkkkzkkwk.",".kwkzkyyykzkkwk.",".kwkzkykykzkkwk.",
".kwkzkyyykzkkwk.",".kwkzkkkkkzkkwk.",".kwkzzzzzzzzkwk.",".kwkkkkkkkkkwwk.",
".kwwwwwwwwwwwwk.","..kkkkkkkkkkkk..","................","................"],P);
/* 输出框 */
IC.output=px([
"................","..kkkkkkkkkkkk..",".kGGGGGGGGGGGGk.",".kGkkkkkkkkkkGk.",
".kGkzzzzzzzzkGk.",".kGkzkkkkkzkGk.",".kGkzkeeeekzGk.",".kGkzkeekkezGk.",
".kGkzkeeeekzGk.",".kGkzkkkkkzkGk.",".kGkzzzzzzzzkGk.",".kGkkkkkkkkkkGk.",
".kGGGGGGGGGGGGk.","..kkkkkkkkkkkk..","................","................"],P);
IC.lockIcon=px([
"................",".....kkkkkk.....","....kk....kk....","....k......k....",
"....k......k....","..kkkkkkkkkkkk..","..kBBBBBBBBBBk..","..kBBBBByyBBBk..",
"..kBBBByyyyBBk..","..kBBBByyyyBBk..","..kBBBBByyBBBk..","..kBBBBBByBBBk..",
"..kBBBBBBBBBBk..","..kkkkkkkkkkkk..","................","................"],P);
IC.emerald=px([
"................","......kkkk......","....kkeeeekk....","...keeeleeeek...",
"..keeeleeeewk...","..keelleeeewek..","..keelleeeewek..","..keeeleeeewek..",
"...keeeeeewwk...","....kkeewwkk....","......kkkk......","................",
"................","................","................","................"],P);
IC.beacon=px([
"................",".......yy.......","......kyyk......",".....kyyyyk.....",
"....kywwwwwyk...","...kywwwwwwwyk..","..kywwkkwkkwyk..","..kywwwwwwwyk..",
"...kkyyyyyyykk..","..kggggggggggk..","..kgGGGGGGGGgk..","..kkkkkkkkkkkk..",
"................","................","................","................"],P);
IC.book=px([
"................","..kkkkkkkkkkk...",".kBBBBBBBBBBBk..",".kBwBwBwBwBwBBk.",
".kBBBBBBBBBBBk..",".kBwBwBwBwBwBBk.",".kBBBBBBBBBBBk..",".kBBBBBBBBBBBk..",
".kBBBBBBByBBBBk.",".kBBBBBBByBBBBk.",".kBBBBBBBByBBBk.",".kBBBBBBBBBByBk.",
".kkkkkkkkkkkyk..","...........kk...","................","................"],P);
</script>
<script>
/* ================= 程序化音频引擎 ================= */
const AU={
  ctx:null,muted:false,_hum:null,
  ensure(){ if(this.muted)return null;
    if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext; if(AC)this.ctx=new AC();}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
    return this.ctx;},
  env(g,t0,a,d,v){g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);},
  osc(type,f0,f1,t0,dur,vol){const c=this.ensure();if(!c)return;
    const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    this.env(g,t0,0.008,dur,vol);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+dur+0.15);},
  lever(){const c=this.ensure();if(!c)return;const t=c.currentTime;
    this.osc('square',900,260,t,0.05,0.10);
    const b=c.createBuffer(1,2205,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=c.createBufferSource(),g=c.createGain();s.buffer=b;
    this.env(g,t,0.002,0.05,0.22);s.connect(g).connect(c.destination);s.start(t);},
  hum(on){
    if(!on){if(this._hum){try{this._hum.o.stop();this._hum.o2.stop();}catch(e){}this._hum=null;}return;}
    const c=this.ensure();if(!c)return;
    if(!this._hum){const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=50;o2.type='sine';o2.frequency.value=150;g.gain.value=0.028;
      o.connect(g);o2.connect(g);g.connect(c.destination);o.start();o2.start();this._hum={o,o2,g};}},
  ding(){const c=this.ensure();if(!c)return;const t=c.currentTime;
    this.osc('sine',784,784,t,0.28,0.16);this.osc('sine',1046,1046,t+0.17,0.55,0.16);},
  reg(){const c=this.ensure();if(!c)return;const t=c.currentTime;
    this.osc('triangle',523,784,t,0.15,0.18);this.osc('triangle',1046,1046,t+0.08,0.3,0.12);},
  beacon(){const c=this.ensure();if(!c)return;const t=c.currentTime;
    [261.6,329.6,392,523.2,659.2,784].forEach((f,i)=>this.osc('triangle',f,f,t+i*0.13,0.7,0.15));}
};

function mkScene(parent){

function put(sc,opt){

function wire(sc,pts){

function wlabel(sc,txt,x,y,size,fill){

  t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('font-size',size||20);
  t.setAttribute('fill',fill||'#fff');t.setAttribute('text-anchor','middle');
  t.setAttribute('paint-order','stroke');t.setAttribute('stroke','#000');t.setAttribute('stroke-width','3');
  t.textContent=txt;sc.wires.appendChild(t);return t;

/* ================= 拉杆位板（通用 N 位任意进制） ================= */
function leverPanel(container,weights,base){
  /* weights: 从高位到低位，如 [8,4,2,1] 或 [25,5,1]；base 决定每位循环上限 */
  base=base||2;
  const st={bits:weights.map(()=>0)};
  const panel=h('div','mc-panel mt8');
  const lamps=[],labels=[];
  const row=h('div','row');row.style.justifyContent='center';row.style.gap='14px';
  weights.forEach((wg,i)=>{
    const col=h('div','center');
    col.style.cssText='display:flex;flex-direction:column;align-items:center;gap:4px';
    const lamp=h('div');lamp.style.cssText='width:64px;height:64px;cursor:pointer;flex-shrink:0;position:relative';
    lamp.innerHTML=IC.lampOff;
    lamp.onclick=()=>{st.bits[i]=(st.bits[i]+1)%base;AU.lever();render();};
    lamps.push(lamp);
    const lev=h('button','mc-btn','拉杆');
    lev.style.cssText='width:64px;height:36px;font-size:13px;padding:2px';
    lev.onclick=()=>{st.bits[i]=(st.bits[i]+1)%base;AU.lever();render();};
    const lb=h('div','small');lb.textContent='×'+wg;
    labels.push(lb);
    col.appendChild(lamp);col.appendChild(lev);col.appendChild(lb);
    row.appendChild(col);
  });
  panel.appendChild(row);
  const sum=h('div','big-dec mt8');panel.appendChild(sum);
  const exp=h('div','center small mt8');exp.style.color='#ffe8a0';panel.appendChild(exp);
  container.appendChild(panel);
  function val(){return st.bits.reduce((a,b,i)=>a+b*weights[i],0)}
  function render(){
    lamps.forEach((l,i)=>{
      const v=st.bits[i];
      l.innerHTML=v>0?IC.lampOn:IC.lampOff;
      l.classList.toggle('sig1',v>0);
      /* 显示当前位值 */
      let tag=l.querySelector('.lv-tag');
      if(!tag){tag=h('div','lv-tag');tag.style.cssText='position:absolute;bottom:-2px;right:-2px;background:#111;color:#7fd0ff;font-size:14px;padding:0 4px;border:2px solid #555;min-width:20px;text-align:center';l.appendChild(tag);}
      tag.textContent=DIGITS[v];
    });
    AU.hum(st.bits.some(b=>b));
    sum.textContent=val();
    exp.textContent=st.bits.map((b,i)=>DIGITS[b]+'×'+weights[i]).join(' + ')+' = '+val();
  }
  render();
  return {st,val,render,weights};
}

/* ================= 寄存器显示（任意进制逐位） ================= */
function registerDisplay(container,base,count){
  const panel=h('div','mt8');
  panel.innerHTML='<div class="center"><span class="base-badge">'+base+' 进制寄存器</span></div>';
  const box=h('div','digit-box mt8');panel.appendChild(box);
  const labels=h('div','digit-box');panel.appendChild(labels);
  const cells=[];
  for(let i=0;i<count;i++){
    const wrap=h('div');
    const d=h('div','digit','0');box.appendChild(d);
    const lb=h('div','digit-label');lb.textContent='第'+(count-i)+'位';labels.appendChild(lb);
    cells.push({d,lb});
    wrap.style.display='contents';
  }
  container.appendChild(panel);
  return {
    setValue(n){
      const s=toBase(n,base).padStart(count,'0').slice(-count);
      cells.forEach((c,i)=>{
        c.d.textContent=s[i];
        c.d.classList.toggle('on',s[i]!=='0');
        c.d.classList.toggle('hold',s[i]!=='0'&&DIGITS.indexOf(s[i])>=10);
      });
    },
    setStr(str){
      const s=String(str).padStart(count,' ').slice(-count);
      cells.forEach((c,i)=>{
        c.d.textContent=s[i]===' '?'0':s[i];
        const on=s[i]!=='0'&&s[i]!==' ';
        c.d.classList.toggle('on',on);
        c.d.classList.toggle('hold',on&&DIGITS.indexOf(s[i])>=10);
      });
    },
    getCells(){return cells}
  };
}

const L1_CHALLENGES=[
  {target:5,base:2,bits:4,desc:'把 5 输入进去，看看 4 盏灯怎么亮'},
  {target:9,base:2,bits:4,desc:'换成 9，注意最左边那盏 ×8 的灯'},

  const lamps=[];
  for(let i=0;i<4;i++){
    const lp=put(sc,{x:700+i*70,y:170,w:60,h:60,ic:IC.lampOff});
    lamps.push(lp);
    wlabel(sc,'×'+[8,4,2,1][i],730+i*70,260,16,'#ffe8a0');
  }
  const w1=wire(sc,[[220,210],[400,210],[400,210],[460,210]]);
  const w2=wire(sc,[[580,210],[640,210],[640,200],[700,200]]);
  const panel=h('div','mc-panel mt8');

    +'<div class="center mt8"><button class="mc-btn g" id="l1-go">通电！</button></div>'
    +'<div class="bits mt8" id="l1-bits"></div>'

      +'<div class="center small mt8">'+v+' = '+bits.map((b,i)=>b+'×'+[8,4,2,1][i]).join(' + ')+'</div>';
  }

    +'<div class="center" style="font-size:28px;color:var(--gold)">→</div>'
    +'<div class="center"><b>输出进制</b><div class="base-tabs" id="f-out"></div></div></div>';
  lab.appendChild(basePanel);
  const BASES=[2,8,10,16,36];
  BASES.forEach(b=>{
    const bi=h('button',b===FORGE.inBase?'on':'',b+' 进制');
    bi.onclick=()=>{FORGE.inBase=b;buildForgeBody();};
    $('#f-in',basePanel).appendChild(bi);
    const bo=h('button',b===FORGE.outBase?'on':'',b+' 进制');
    bo.onclick=()=>{FORGE.outBase=b;buildForgeBody();};
    $('#f-out',basePanel).appendChild(bo);
  });
  /* 工作区 */
  const work=h('div','mt12');lab.appendChild(work);
  function buildForgeBody(){
    work.innerHTML='';
    $('#f-mode').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===FORGE.mode));
    $('#f-mode').querySelectorAll('button').forEach(b=>b.onclick=()=>{FORGE.mode=b.dataset.m;AU.lever();buildForgeBody();});
    $('#f-in').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',BASES[i]===FORGE.inBase));
    $('#f-out').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',BASES[i]===FORGE.outBase));
    /* 输入区 */
    const inPanel=h('div','mc-panel');
    if(FORGE.mode==='input'){
      inPanel.innerHTML='<div class="center"><span class="base-badge">输入 · '+FORGE.inBase+' 进制</span></div>'
        +'<input class="num-input mt8" id="f-val" placeholder="输入数字'+(FORGE.inBase>10?'（可用 0-9 A-'+DIGITS[FORGE.inBase-1]+'）':'')+'">';
      const inp=inPanel.querySelector('#f-val');
      inp.addEventListener('input',()=>{
        const v=fromBase(inp.value,FORGE.inBase);
        FORGE.value=v===null?0:v;
        renderOut();
      });
    }else{
      const bits=Math.ceil(Math.log2(Math.pow(FORGE.inBase,4)));
      const weights=[];
      for(let i=Math.min(bits-1,7);i>=0;i--)weights.push(Math.pow(FORGE.inBase,i));
      const lp=leverPanel(inPanel,weights);
      lp.render=Object.assign(function(){lp.render.__proto__},lp.render);
      const origRender=lp.render.bind(lp);
      lp.render=function(){origRender();FORGE.value=lp.val();renderOut();};
    }
    work.appendChild(inPanel);
    /* 寄存器 */
    const regPanel=h('div','paper mt8');
    regPanel.innerHTML='<h3>静置器（寄存器）</h3><p class="small">红石灯的亮灭被「冻结」在这里，变成可以组合的数字位。</p>';
    const regCount=4;
    const regIn=registerDisplay(regPanel,FORGE.inBase,regCount);
    const regOut=registerDisplay(regPanel,FORGE.outBase,regCount);
    work.appendChild(regPanel);
    /* 输出区 */
    const outPanel=h('div','mc-panel mt8');
    outPanel.innerHTML='<div class="center"><span class="base-badge">输出 · '+FORGE.outBase+' 进制</span></div>'
      +'<div class="big-dec mt8" id="f-outval">0</div>'
      +'<div class="center small mt8" id="f-expan"></div>';
    work.appendChild(outPanel);
    function renderOut(){
      const v=FORGE.value;
      regIn.setValue(v);regOut.setValue(v);
      $('#f-outval').textContent=toBase(v,FORGE.outBase);
      const parts=expand(v,FORGE.outBase);
      $('#f-expan').textContent=parts.map(p=>p.d+'×'+p.w).join(' + ')+' = '+v+'（十进制）';
      /* 通关判定：输出过 3 个不同的进制结果 */
      if(!FORGE._seen)FORGE._seen=new Set();
      FORGE._seen.add(FORGE.outBase+':'+toBase(v,FORGE.outBase));
      if(FORGE._seen.size>=3&&!cleared('forge')){
        clearStage('forge');victory();
      }
    }
    renderOut();
  }
  buildForgeBody();
}
function victory(){
  AU.beacon();award('forge');
  const oldBag=S.old&&S.old.bag?S.old.bag:[];
  const hasOld=oldBag.length>0;
  $('#cert-body').innerHTML='<h2>荣 誉 证 书</h2>'
    +'<p>兹授予</p><div class="cname">进制造物主</div>'
    +'<p>「<b>进制转换机总工程师</b>」称号</p>'
    +'<p class="small">从 0 和 1 到 Z，你已经掌握了所有进制的密码。<br>'
    +(hasOld?'而且……你的背包里还带着上一作的零件。真正的工程师，走到哪里都认得出红石的光。':'')+'</p>'
    +'<p class="small">'+new Date().toLocaleDateString('zh-CN')+'</p>'
    +'<div class="row mt12" style="justify-content:center">'
    +'<button class="mc-btn g" id="cert-stay">继续造物</button>'
    +'<button class="mc-btn" id="cert-map">返回地图</button></div>';
  $('#ov-beam').classList.add('on');
  $('#cert-stay').onclick=()=>{$('#ov-beam').classList.remove('on');AU.lever();};
  $('#cert-map').onclick=()=>{$('#ov-beam').classList.remove('on');show('map');buildMap();};
}
$('#forge-clear').onclick=()=>{FORGE._seen=new Set();openForge();AU.lever();toast('机器已重置','');};
$('#btn-back2').onclick=()=>{AU.hum(0);AU.lever();show('map');buildMap();};

<script>
